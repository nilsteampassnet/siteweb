# Stated plainly on the page — do not delete to make the table look better.
weaknesses:
  - title: No native mobile applications
    body: >-
      Bitwarden, Vaultwarden and Passbolt ship mobile clients; Teampass does
      not. If your team needs credentials on phones, that is a real gap and you
      should weigh it seriously.
  - title: The browser extension is a paid add-on
    body: >-
      Bitwarden and Passbolt include theirs at no cost. Ours is what funds the
      project, and the server stays fully usable without it — but it is a
      difference worth knowing before you compare price tags.
  - title: A smaller ecosystem
    body: >-
      Bitwarden has a large company, formal audits and a broad integration
      ecosystem behind it. Teampass is a long-lived project with a small core
      team. Choose accordingly.
