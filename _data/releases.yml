# Release highlights.
#
# `highlights` feeds the home page cards; `versions` feeds /whats-new.html.
# A highlight's optional `url` adds a "Learn more" link: a page of this site
# when one exists, the documentation otherwise.
# Source of truth: https://github.com/nilsteampassnet/TeamPass/releases

line: "3.2"

highlights:
  - title: Passkeys
    url: /passkeys.html
    icon: key
    body: >-
      Teampass keeps the passkeys of other sites in its items, with a private
      key that never leaves the server, and users can sign in to Teampass
      itself with a passkey, as a second factor or without a password.

  - title: Linux password rotation
    url: /lapr.html
    icon: refresh
    body: >-
      LAPR changes the passwords of local Linux accounts over SSH, agentless,
      from the item that stores them — pushing to the server first, then
      re-encrypting the vault entry.

  - title: Authenticated encryption
    url: /security.html
    icon: lock
    body: >-
      AES-256-GCM replaces AES-CBC, with random IVs, per-secret salts,
      256-bit object keys, PBKDF2 at 600,000 iterations and HKDF-SHA256.
      Existing vaults migrate lazily, on first read.

  - title: Security Posture Dashboard
    url: https://documentation.teampass.net/#/features/security-posture
    icon: gauge
    body: >-
      Weak, reused, breached and overdue credentials at a glance, a personal
      security score for every user, and quality indicators shown while
      editing an item.

  - title: Governance built in
    url: /for-enterprise.html
    icon: clipboard-check
    body: >-
      Access recertification campaigns, rotation policy tracking, leaver risk
      detection, four-level data classification and CSV evidence export.

  - title: Secure Send
    url: /secure-send.html
    icon: send
    body: >-
      Share a credential with someone outside Teampass under an expiry, a view
      limit and an optional recipient passphrase.

versions:
  - version: 3.2.4.2
    date: 2026-11-08
    summary: Security release keeping managers and HR managers within the accounts and folders they administer, requiring the session key on every administration action, and making generic OpenID Connect providers work.
    changes:
      - group: Security
        items:
          - "Managers and HR managers can only grant folders within their own scope as allowed or forbidden folders (GHSA-vrhq-38vx-9vjp)"
          - "Every administration action requires the session key (GHSA-7wvw-wxqx-v364)"
          - "The Users list is limited to users who may open the Users page, and only displayed columns can be sorted (GHSA-5cwc-6hfp-2mr7)"
          - "The folder rights of an account are only shown to the people who administer it (GHSA-28mq-vx4v-72h8)"
          - "Only administrators grant the root-folder creation right (GHSA-57ww-wx2c-hx7x)"
          - "The folder list no longer returns the path of a folder the user cannot access (GHSA-5mff-6g7v-9v6v)"
          - Account creation checks the administrating role against the roles the creator may grant
      - group: New
        items:
          - Generic OpenID Connect providers such as authentik and Keycloak work, with sub and preferred_username required
      - group: Improved
        items:
          - 489 Chinese and 3 German translations added from POEditor
      - group: Fixed
        items:
          - OAuth2 users can generate new keys and rebuild their keys again, Microsoft Entra ID included
          - An LDAP account without a key pair gets its keys generated at its first login instead of an HTTP 500
          - The command-line upgrade reconnects after an idle database connection and no longer reverts a complete upgrade
      - group: Upgrade notes
        items:
          - Code only, installations on 3.2.4.0 or 3.2.4.1 are not sent through the upgrade wizard
          - Existing manager grants are kept, and folders outside a manager's scope are dropped from now on
          - "A generic OpenID Connect provider needs the scopes openid,profile,email, and usernames controlled by its administrators"

  - version: 3.2.4.1
    date: 2026-11-03
    summary: Security release enforcing the per-item restriction on item history, one-time codes, attachment previews, item details, exports and item creation, and ending the sessions opened before a password change.
    changes:
      - group: Security
        items:
          - "Item history and one-time codes require read access to the item, not only to its folder (GHSA-75qw-h7p8-ppr3)"
          - "The attachment preview checks access to the attachment's item before decrypting it (GHSA-jxj9-mcx4-h34j)"
          - "Role restrictions apply to the item details and to the four export formats, and the export handler enforces the Export permission (GHSA-h66m-8w9q-86r2)"
          - "Creating an item can no longer add a role restriction to another existing item (GHSA-jgmv-3gr2-fjpw)"
          - "A password change, a password recovery or an administrator key generation ends the sessions opened before it, and session extension is capped (GHSA-p84q-3h9h-qvh6)"
          - "Key generation no longer resets the caller's own password without the current one (GHSA-2vf9-2qw7-8hmr)"
          - Symfony http-foundation and mime updated to 6.4.49
      - group: Improved
        items:
          - The pre-upgrade backup of the command-line upgrade is listed with the on-the-fly backups and kept until deleted
      - group: Fixed
        items:
          - Non-administrators get the target folder list again when importing from Bitwarden, LastPass, 1Password or KeePassXC
          - A role restriction chosen when creating an item is saved
      - group: Upgrade notes
        items:
          - Code only, installations on 3.2.4.0 are not sent through the upgrade wizard
          - The export handler refuses administrators and users without an allowed role, like the Export menu, and leaves out items restricted to other roles
          - Items created with a role restriction before 3.2.4.1 carry none, so their owners should set it again
          - A password change signs out copies of the previous session, and API clients such as the browser extension sign in again
  - version: 3.2.4.0
    date: 2026-11-01
    summary: Opens the 3.2.4 line with a command-line upgrade, a redesigned item view and edit form, a Secure Send inventory and a Recovery Package reminder, and closes a High severity installer flaw.
    changes:
      - group: Security
        items:
          - "The installer no longer accepts a session opened before the setup on instances installed with 3.2.3.1 to 3.2.3.3 (GHSA-6x8j-28p6-mmfm)"
          - Tags and Knowledge Base labels can no longer run script in the item view
          - Tag suggestions only offer the tags of items the user can read
          - The command palette no longer reveals the names of inaccessible parent folders
          - Knowledge Base item suggestions respect item restrictions
      - group: New
        items:
          - A command-line upgrade backs up the database, runs the upgrade in maintenance mode and restores the backup if a step fails
          - The item view is redesigned, with a sticky action bar, credential rows and foldable sections
          - The item edit form fits on one page, with foldable sections, Ctrl+S and file cards for attachments
          - An icon picker for item and folder icons, with search and suggestions
          - Tags are edited as chips
          - A Secure Send inventory lists the active links of the user, each one revocable
          - The administrator dashboard reminds administrators to save a Recovery Package
          - A community card on the administrator dashboard lists ways to help Teampass be found and funded
      - group: Improved
        items:
          - Searches match the displayed text, without regard to accents
          - The Secure Send settings explain their scope, and refused Host headers are logged
      - group: Fixed
        items:
          - The web installer shows its final page again
          - Folder, favourite and Knowledge Base names no longer show HTML entities
          - The web upgrade wizard enables maintenance mode
          - Docker images run the upgrade data clean-ups
          - Background tasks wait until the database matches the deployed files
          - restore.php --force-disconnect disconnects users under strict SQL mode
          - Several item view and edit form glitches
      - group: Upgrade notes
        items:
          - No schema change, but the move to the 3.2.4 line runs the upgrade once, through the wizard, the command line or the Docker entrypoint
          - The web wizard enables maintenance mode and disconnects users while it runs
          - Every upgraded instance asks for a Recovery Package on the dashboard until one is downloaded
          - Instances installed with 3.2.3.1 to 3.2.3.3 should delete or lock down public/install and check the indicators of compromise listed in GHSA-6x8j-28p6-mmfm
  - version: 3.2.3.3
    date: 2026-10-26
    summary: Maintenance release closing an attachment authorization flaw, repairing upgrade paths that stopped or skipped migrations, and adding disaster recovery onto a fresh server and experimental QR pairing for external devices.
    changes:
      - group: Security
        items:
          - "Deleting an attachment requires the edit right, and a new item only receives the files its own session uploaded (GHSA-r6r4-5mr3-rppm)"
      - group: New
        items:
          - Disaster recovery restores a complete encrypted backup and its Recovery Package onto a fresh server, verified and upgraded before activation
          - Experimental QR pairing of external devices, off by default, with expiring and individually revocable device credentials, for client developers until a client is published
      - group: Improved
        items:
          - Backups are taken from a single consistent database snapshot
          - The database records the complete release that last upgraded it, and the upgrade wizard shows the version it upgrades from
          - The browser extension documentation covers the popup features added since 1.8.2
      - group: Fixed
        items:
          - Docker images no longer skip migrations on databases coming from 3.2.2.6 or earlier, which broke non-administrator sign-ins
          - No sign-in is accepted while a database upgrade is pending, OAuth2 and passkeys included
          - An unusable internal TP account key is detected and can be rebuilt, instead of silently leaving users without access when their keys are generated
          - Upgrades from 2.x no longer stop with an HTTP 500 on the user keys step
          - The upgrade wizard no longer stops at 3.1.5 on databases migrated from 2.x
          - LAPR rates rotated passwords, and deleting an endpoint releases its managed accounts
      - group: Upgrade notes
        items:
          - Schema change, the upgrade wizard runs once and adds one table, four columns and three device pairing settings
          - Backups keep maintenance mode on while they run and sign out non-administrators who use Teampass meanwhile, so schedule them outside working hours
          - Docker instances already upgraded from 3.2.2.6 or earlier to 3.2.3.0–3.2.3.2 should run the check described in the Docker guide
          - After a disaster recovery, offline API clients must send back the generation adopted on their last full sync
  - version: 3.2.3.2
    date: 2026-10-20
    summary: Corrective release that makes fresh installations work again after 3.2.3.1, verifies the SMTP server certificate, and shows creation and modification dates in the knowledge base.
    changes:
      - group: Security
        items:
          - "Fresh installations no longer stop at the database step, where 3.2.3.1 refused 35 tables (GHSA-pxjv-6qgf-xhcg)"
          - The certificate of the SMTP server can be verified, on by default for new installations
      - group: New
        items:
          - Knowledge base articles show their creation and modification dates
      - group: Fixed
        items:
          - Licence dates follow the date format of the instance, and the licence panel no longer shows the expiry one day late east of UTC
          - Article titles and categories containing an ampersand are no longer re-encoded on each save
          - Translations holding an identifier instead of a text are removed in Italian, Polish and Brazilian Portuguese
      - group: Upgrade notes
        items:
          - The upgrade wizard runs once, to add the article dates to the knowledge base
          - Upgraded installations keep SMTP certificate verification off until it is enabled in Admin, Emails
          - After a failed 3.2.3.1 installation, start again from an empty database with 3.2.3.2
          - Never install 3.2.3.0 or older to work around it, they carry two Critical flaws
  - version: 3.2.3.1
    date: 2026-10-16
    summary: Security release closing two Critical unauthenticated remote code execution flaws, in the access guard of the AJAX handlers and in the installer, with private backup files and a Licence tab charting the browser extension seats.
    changes:
      - group: Security
        items:
          - Requests without a session no longer pass the shared access guard of the AJAX handlers, which let an anonymous visitor change settings and run an uploaded PHP file (GHSA-988j-pf6f-2m2r)
          - The installer is refused once Teampass is installed, and its steps require an install session and a CSRF token (GHSA-8xp7-fh3p-5pcr)
          - The files and upload folders can no longer be set inside the public directory, and the Docker nginx configuration no longer executes PHP under /assets and /plugins
          - Backup files and their metadata are no longer readable by every local account
      - group: New
        items:
          - A Licence tab in the statistics shows the extension seats used this month, refused users and the seats of the last 31 days
      - group: Improved
        items:
          - The browser extension documentation is rewritten around user setup and administrator enablement
      - group: Fixed
        items:
          - The upgrade no longer stops on a database whose name contains a dot
          - A backup comment that cannot be saved is reported as a failure
      - group: Upgrade notes
        items:
          - No database change, replace the files and there is no upgrade wizard to run
          - Upgrading is required for every installation
          - On your own nginx, deny PHP files under /assets and /plugins, as the installation guide shows
          - Check that the files and upload folders are outside the public directory
          - The seat chart fills in once the licence server provides the daily history
  - version: 3.2.3.0
    date: 2026-10-12
    summary: Passkeys arrive in Teampass, kept in items for other sites and used to sign in to Teampass itself, with a Secure Send activity journal, Folders and Roles pages that scale to large trees, and a High severity fix for the administration of roles by managers.
    changes:
      - group: Security
        items:
          - Managers and HR managers are bound to their own roles and folders on the Roles page, and the AD group mapping is reserved to administrators (GHSA-j3ph-4847-695h)
      - group: New
        items:
          - The passkeys of other sites are kept in Teampass items and used through the browser extension 1.8.0, with a private key that never leaves the server
          - Users sign in to Teampass with a passkey, as a second factor or without a password
          - A Secure Send activity journal records creations, reveals, failed attempts, revocations, invalidations and expiries, metadata only
          - A Secure Send usage card in the user statistics
          - An optional retention, in days, for the Secure Send activity journal
          - The administrator live activity shows failed sign-ins and lockouts, and gains an expanded view
      - group: Improved
        items:
          - The Folders page and the Roles permission matrix stay usable on trees of several thousand folders
          - The Profile page is organised in six sections
          - The current password sent with a password change is no longer stored
          - Items created or deleted through the API appear in the author's open folder without a reload
      - group: Fixed
        items:
          - Signing out and opening the profile work again in Safari
          - The upgrade from 2.x no longer stops with an HTTP 500 after the key file is renamed
          - The file integrity scan no longer stays in progress on NFS storage
          - The permission repair plan covers the data folders stored on their own volume
          - Accented and special characters are displayed correctly on the Renewal page
          - A new password is no longer refused because of a very short name
      - group: Upgrade notes
        items:
          - Schema change, the upgrade wizard runs once and adds four tables and eight settings
          - Both passkey features stay off until an administrator enables them, and need HTTPS
          - Changing the relying party ID makes every registered sign-in passkey unusable
          - Review the permission matrix of each role and the AD group mappings for changes made by managers
          - A folder can no longer be created in, or moved to, a parent that is read-only for the user
  - version: 3.2.2.8
    date: 2026-10-07
    summary: Maintenance release — Restore missing sharekeys can rebuild keys from any user who can still open the objects, three Health page findings can be cleared again, and the PHP libraries are shipped rather than installed with Composer.
    changes:
      - group: Improved
        items:
          - Restore missing sharekeys can open the objects with the keys of another user, whose password is checked on the server and whose use is recorded in the system logs
          - Every key is checked against the data it must open, so a stale key is replaced instead of being copied to the users missing one
          - The Fix items are empty after user OTP change tool is removed, replaced by Restore missing sharekeys with a reference user
          - The PHP libraries are shipped with the release and never installed with Composer, in the guides and in the Docker image
      - group: Fixed
        items:
          - Items with an empty password are no longer reported as corrupted
          - Users whose legacy keys were emptied by the personal items recovery are no longer reported as inconsistent forever
          - The Items integrity scan also removes the orphan sharekeys left on attachments, custom fields, history entries and suggestions
      - group: Upgrade notes
        items:
          - No database change, replace the files and there is no upgrade wizard to run
          - Do not run Composer after replacing the files
          - Run Restore missing sharekeys after upgrading if the Health page reports missing or corrupted keys
          - The repair may now replace an existing key, only when the object is proven to be encrypted with another one
  - version: 3.2.2.7
    date: 2026-10-04
    summary: Two advisories, private key recovery copies sealed against database dumps and MFA enforced for roles inherited from AD groups, plus folder deletion protection and Markdown and category browsing in the knowledge base.
    changes:
      - group: Security
        items:
          - A database dump alone no longer reveals the users' private keys, whose recovery copy is now sealed with the instance key (GHSA-fv78-jwjv-pj25)
          - The LDAP bind password and the SMTP password are encrypted with the instance key and never sent back to the settings pages
          - The MFA role requirement also applies to roles inherited from AD groups, and saving the user form no longer turns them into manual roles (GHSA-6mg2-rh62-rr3g)
          - The Docker image logs request paths without their query string or Referer, so Secure Send link credentials stay out of its access log
          - The session cookie is marked Secure behind a trusted reverse proxy that terminates HTTPS
      - group: New
        items:
          - Administrators can protect a folder against accidental deletion, which also blocks deleting any parent folder containing it
          - A branded Secure Send recipient page, with an organisation name, the local custom logo and an opt-in sender name
          - A List / Categories switch on the knowledge base page
          - Markdown pasted into a knowledge base article is formatted, and an Edit as Markdown view sits next to the code view
      - group: Improved
        items:
          - A folder holding items used by LAPR can no longer be deleted or moved into a personal folder
          - A Secure Send deployment and hardening guide
          - The dead INSTALL_MODE=auto Docker option is removed, and the Docker Hub volume and backup instructions are fixed
          - Open sessions are closed while a database upgrade is pending
          - Polish is fully translated
      - group: Fixed
        items:
          - Key generation for a new account resumes in slices instead of failing at the task time limit on a large vault
          - The sharekeys repair restores the owner's key on personal items damaged by issue 5407
          - "LDAP bind and SMTP passwords containing &, ', \", < or > are saved as typed instead of HTML-encoded"
          - See log works for an account without any log
          - The file integrity check of the Docker image no longer reports three critical unknown files
          - Knowledge base articles keep their image sizes, merged cells and literal HTML code samples
      - group: Upgrade notes
        items:
          - Schema change and data migration, the upgrade wizard runs once on every installation and sign-in is closed until it has run
          - Database dumps taken before the upgrade still open the private keys and must be protected or destroyed
          - Returning to an older version after the upgrade is not supported
          - Users holding the MFA role only through an AD group are asked for MFA at their next sign-in
          - The Docker access log format changed, and INSTALL_MODE, ADMIN_EMAIL and ADMIN_PWD are no longer read
          - The sender name on Secure Send pages stays off on upgraded installations until an administrator enables it
  - version: 3.2.2.6
    date: 2026-10-01
    summary: Three access-control advisories, folder rights enforced on item creation, and a reworked Secure Send with reveal confirmation, item snapshots and opt-in TOTP sharing.
    changes:
      - group: Security
        items:
          - "Creating, revealing and listing a Secure Send link require current access to the item, so a user can no longer share an item from a folder they cannot see or an item restricted to others (GHSA-chpj-3vff-555v)"
          - "The personal-items recovery dialog only acts on the signed-in user's own account (GHSA-6rq2-hf9c-cxh2)"
          - "Deleting an item deletes that item alone, instead of also deleting another item whose key was sent with the request (GHSA-ghj3-wppx-w8j3)"
          - A read-only role can no longer create items in a folder or copy items into it, and delete buttons are hidden without the delete right
          - New installations lock an account after 10 failed logins instead of never, and the administrator dashboard warns while an existing installation still has no threshold
          - The Security posture scan only queries Have I Been Pwned when breach detection is enabled, and a replaced compromised password loses its breach badge
      - group: Secure Send
        items:
          - Recipients confirm on the page before the content is revealed, so a link scanner cannot consume a view, and view limits hold under concurrent requests
          - Item links share an encrypted snapshot of the item as it was when the link was created
          - Sharing the current TOTP code is an explicit option, unchecked by default, and the TOTP secret never reaches the browser
          - The public sharing address accepts a full HTTPS URL or a hostname, is validated on save, and is only used when the sender selects it
          - The sender form can no longer generate two links or copy a stale one, and follows the AdminLTE layout
      - group: New
        items:
          - A custom login background, and login logo and background images picked by file name from a dedicated public/assets/custom folder
          - A Configuration check panel on the LDAP settings page, whose test button now runs the real login code
          - A totp column in the CSV export, written as an otpauth URI for non-standard profiles
          - A per-role switch for the Security posture Fix shortcuts, which now only point to items the user may edit
      - group: Improved
        items:
          - A clear permission error when the configuration directory cannot be read, instead of the installer or a bare HTTP 500, and an installer that refuses a database already in use
          - The password show button of the item form is a toggle, remembered in the browser
          - Background tasks start on Windows without opening console windows
          - Scheduled backup report e-mails use a table layout in every shipped language
          - A rewritten security hardening guide and a new Security posture documentation page
      - group: Fixed
        items:
          - Accounts created on 3.0.x whose password holds special or accented characters can log in after the upgrade
          - Personal-items recovery after a key regeneration re-encrypts the items again
          - Saving a personal item created by another user no longer removes its owner's access
          - Personal items still encrypted with a 2.x salt key can be migrated again
          - Accented search terms find labels saved from the item form, and search results show accented characters instead of HTML entities
          - The KeePass import no longer stops on an entry without a title, and imports passwords containing & as written
          - Duo starts in one click when it is the only MFA method
          - The browser extension FQDN suggestion is a placeholder instead of a value that only looked saved
          - The Docker example environment file defaults to the latest image tag
      - group: Upgrade notes
        items:
          - Schema change, the upgrade wizard runs once on every installation
          - Set a lockout threshold if the administrator dashboard reports that failed logins never lock an account
          - Users with read-only access on a folder can no longer create items there
          - Secure Send recipients press a confirmation button, and requiring a passphrase or disabling notes now also applies to existing links
          - If the public sharing address is a short prefix, check the public route, new links always use HTTPS and keep the main URL's port and path
          - On Docker, mount individual branding files into public/assets/custom rather than the folder itself
          - Back up the database before upgrading

  - version: 3.2.2.5
    date: 2026-09-19
    summary: Two access-control advisories on item moves and folder copies, individual password renewal periods, and a rebuilt Monitoring logs page.
    changes:
      - group: Security
        items:
          - "Copying a folder requires access to the target folder, and skips the items the user is restricted from and the subfolders they are denied (GHSA-q47m-rvr6-jqw7)"
          - "Moving an item through the REST API requires the delete right on the source folder and the edit right on the target (GHSA-q47m-rvr6-jqw7)"
          - "The item edit form checks the move rights on the item's own folder instead of the destination (GHSA-vxv5-cr34-5q7g)"
          - Moving an item to a personal folder through the API removes the other users' keys, as the web move does
      - group: New
        items:
          - Individual password renewal periods on items, set by anyone who can edit them, with the shorter of the item and folder periods applying
          - The Renewal page moves to the user sidebar, with deadline icons in the item list and the applicable policy shown in folder banners, item forms and move confirmations
      - group: Improved
        items:
          - The Monitoring logs page is rebuilt around a single filter panel, and its purge deletes exactly the entries on screen
          - API authentication refusals name their cause in the log, while the answer sent to the client stays the same
          - Every user allowed to use extension tokens can list and revoke them
          - Selected values in multiple-choice fields are readable, with a 5:1 contrast
          - Rewritten browser extension documentation, with installation from the Chrome, Edge and Firefox stores
      - group: Fixed
        items:
          - Accented characters are no longer saved as HTML entities when client/server encryption is disabled
          - Active Directory groups are mapped to roles when the user DN attribute setting is left empty
          - Restoring a backup stored on S3 no longer fails with a Malformed UTF-8 data error
          - The e-mail test button reports SMTP failures instead of waiting forever, and failed messages stay queued
          - Clearing Knowledge Base logs without dates no longer deletes every matching entry
          - A user's log no longer shows entries recorded for an IP address such as 10.0.0.5
      - group: Upgrade notes
        items:
          - Schema change, the upgrade wizard runs once on every installation
          - The Renewal page leaves the administration area, administrators supervise renewals through the compliance reports
          - Users with the ND, NE or NDNE level on a folder can no longer move its items out, from the web or from the API
          - API item reads return renewal_period, and a move to a personal folder answers 422 while the item's keys are still being distributed
          - Back up the database before upgrading

  - version: 3.2.2.4
    date: 2026-09-12
    summary: Two access-control advisories, idempotent item creation and deletion in the API, and a self-service trial of the browser extension licence.
    changes:
      - group: Security
        items:
          - "The REST API applies item-level restrictions, so a user excluded from an item can no longer read its password or its TOTP code, nor update or delete it (GHSA-gxc6-rgv6-wx99)"
          - "Item access is granted only for a folder of the user's own scope, closing a path where a grant on a subfolder gave read access to the passwords of its parent (GHSA-jr9q-x7pj-8qh9)"
          - The API tag list is scoped to the items the caller can read, instead of returning the tags of every folder in the instance
      - group: New
        items:
          - Self-service trial of the browser extension licence, requested from the Licence tab of the API settings, with an offline path by e-mail, clipboard or QR code for an instance with no Internet access
          - Idempotent item creation and conditional deletion in the REST API, so a client that lost the response can retry without creating a second item
          - A search field in the LDAP synchronization user list
      - group: Improved
        items:
          - Twenty production dependencies refreshed, among them phpseclib 3.0.57, Guzzle 7.15.5, the Symfony 6.4.45 components and TCPDF 6.11.4
          - The Docker image applies the Alpine security updates at build time, and is rebuilt every week so an unchanged release keeps receiving them
      - group: Fixed
        items:
          - "Monitoring logs honour the selected search column, and the Errors, Copy, Admin and Failed logins purges apply the selected account instead of deleting the entries of every account"
          - A newly created folder appears in the Items tree without a manual refresh
          - Renaming, moving or changing the icon of a folder from the Items page no longer resets its special options and its renewal period, and a new subfolder inherits them from its parent
          - The background task log is written again, and two task handlers can no longer run at once
          - The file integrity check no longer warns about the background tasks lock file
          - The login form accepts one submission at a time
          - The admin dashboard no longer reports an enabled scheduled backup as missing, and the new version available notice stops showing after an upgrade
      - group: Upgrade notes
        items:
          - Schema change, the upgrade wizard runs once on every installation
          - Let running background tasks finish before replacing the files, the handler lock file is now kept instead of deleted
          - API clients no longer receive the items the caller is restricted from, and the tag list only covers readable items
          - Re-check the special options and the renewal period of the folders you renamed or moved from the Items page
          - Back up the database before upgrading

  - version: 3.2.2.3
    date: 2026-09-04
    summary: Hotfix — the administration page shipped inert in 3.2.2.2, killed by a JavaScript syntax error.
    changes:
      - group: Fixed
        items:
          - The administration page works again, a template emitted two declarations on a single output line and the whole script block failed to parse
          - The regression guard meant to catch that shape no longer misses a declaration sitting at column zero
      - group: Upgrade notes
        items:
          - No schema change of its own, an installation already running 3.2.2.2 is not sent back through the upgrade wizard

  - version: 3.2.2.2
    date: 2026-09-04
    summary: An unauthenticated entry point to the background scheduler, a leftover installation table holding the administrator password in clear text, and a Docker upgrade path that could leave a container unable to log in.
    changes:
      - group: Security
        items:
          - "The background scheduler wrapper sitting in the web root is removed, and the scheduler itself refuses any invocation that does not come from a command line (GHSA-fpv9-jxph-qg96)"
          - The temporary installation table holding the administrator password in clear text is now really dropped, by the installer and by the upgrade
          - Client-side sanitization helpers rewritten after CodeQL findings, among them an entity decoder that turned a stored escape back into a live quote
      - group: Improved
        items:
          - The admin dashboard information card becomes Actions required, and disappears entirely when there is nothing to act on
          - Five dismissible getting-started recommendations for a fresh installation
          - The file integrity manifest no longer lists the development metadata vendored inside dependencies
      - group: Fixed
        items:
          - A Docker container no longer skips a patch migration and ends up unable to log in
          - The command palette returns items again, its restriction clause targeted the wrong table alias
      - group: Upgrade notes
        items:
          - Data migration without any table alteration, the upgrade wizard runs once on every installation
          - A crontab calling the scheduler over HTTP now gets a 404, the supported invocation has always been the command line one
          - Back up the database before upgrading

  - version: 3.2.2.1
    date: 2026-09-03
    summary: Seven security advisories, four of them in LAPR, plus file integrity diagnostics, folder search and a Docker upgrade path that no longer leaves databases half-migrated.
    changes:
      - group: Security
        items:
          - "LAPR endpoints are now scoped to the caller, so an operator can no longer attach an account to an endpoint whose SSH credential they cannot read (GHSA-mq4w-p2gw-pqp4)"
          - "The SSH host key is verified before the credential is transmitted, closing a window where a man-in-the-middle received the plaintext password of a privileged account (GHSA-h25r-8cc9-2cg8)"
          - "Deleting a managed account and changing its rotation policy now check folder scope, blocking a weak policy from being pushed to a privileged Linux account (GHSA-v7hq-28rv-qh3p)"
          - "The API change feed no longer discloses instance-wide item ids and activity to a caller holding no folder rights (GHSA-9823-p8pg-rfm4)"
          - "The item history detail is encoded where it is rendered, closing a stored cross-site scripting reachable from any edited field (GHSA-mwxw-gg4p-8xpc)"
          - "The item login is rendered as text rather than markup (GHSA-47xg-w656-j4v4)"
          - "Two entity-decoding helpers no longer build a live DOM node while decoding (GHSA-5vf9-rxqv-g8wp)"
          - The command palette applies item-level restrictions, so it no longer returns items the user cannot open
      - group: New
        items:
          - "File integrity and permission diagnostics in System Health, replacing the old unknown-files counter and its web deletion workflow with a read-only report"
          - A command-line integrity script for environments reachable only over SSH
          - Folder results, a folder filter and a reset control on the search page
          - Periodic checks of enrolled LAPR endpoints, and a pause that suspends rotations for one endpoint
          - "Repair my personal items encryption keys, in My Profile, for an owner whose internal reference key went missing"
      - group: Improved
        items:
          - The background key repair task now covers personal items, writing a key for their owner only
          - Personal folders are excluded from key redistribution by their position in the tree, instead of a flag that legacy data never set
          - An empty custom field is no longer reported as unreadable, and can be cleared again
          - The One-Time View page decodes stored entities, so descriptions and logins render as written
          - OAuth2 self-registration assigns the configured fallback role again
          - The Docker container applies every intermediate upgrade step and records the version reached
          - Published Docker images report the real version instead of the branch name
          - Every Tools page query builds its table name from the configured prefix, restoring two repair tools on installations that do not use the default one
          - Search no longer hides items sitting deep inside a personal folder
          - A password changed through the API is recorded in the item history
          - Item revision timestamps are returned wherever the revision is
      - group: Upgrade notes
        items:
          - Schema change — the upgrade wizard runs on every installation
          - Periodic LAPR endpoint checks stay off after an upgrade, so no outbound SSH starts without an administrator enabling it
          - "Updating an item password through the API can now be refused while encryption keys are still being distributed — retry, the message says so"
          - The web workflow that deleted unknown files is gone, replaced by the read-only report
          - Back up the database before upgrading
  - version: 3.2.2.0
    date: 2026-08-23
    summary: LAPR — agentless rotation of Linux account passwords over SSH — plus item revisions for offline synchronization and three new notification types.
    changes:
      - group: New
        items:
          - "LAPR (Linux Account Password Rotation) — Teampass generates a password from a policy, pushes it to the server over SSH, then re-encrypts the item, so the vault only ever records a password the machine actually accepted"
          - "Agentless: nothing is installed on the target servers, and the existing item encryption model is reused rather than a parallel secret store"
          - Managed endpoints with host key trust on first use, reusable rotation policies, and manual or scheduled rotation that retries then suspends instead of hammering an unreachable host
          - "A dedicated audit log that never records a secret, and a separate \"Can manage LAPR\" permission held by non-administrators"
          - Item revisions and a delta endpoint for offline clients, with an optional precondition on update that rejects a conflicting write instead of overwriting it
          - Notifications for local password expiry, knowledge base publication and backup failures
          - "Versioned Docker image tags — teampass/teampass:3.2.2.0 can now be pinned"
      - group: Improved
        items:
          - Search results open in a modal, with copy login and copy password directly on the row
          - A page transition indicator covering navigation and slow AJAX, replacing the Pace plugin
          - Browser-native confirmation dialogs replaced by the Teampass modal
          - Personal folders no longer listed in the role, folder and user management screens
          - Independent manual overrides for each web-server log path
      - group: Upgrade notes
        items:
          - Schema change — the upgrade wizard runs on every installation
          - LAPR is disabled by default, does nothing until an administrator enables it, and needs its own permission that no existing user receives on upgrade
          - Back up the database before upgrading
