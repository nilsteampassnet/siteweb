---
layout: base
---

<header class="tp-page-hero">
  <div class="tp-container">
    {%- if page.eyebrow %}<span class="tp-page-hero__eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}<p class="tp-page-hero__lead">{{ page.lead }}</p>{% endif %}
    {%- if page.cta %}
    <div class="tp-button-row">
      {%- for button in page.cta %}
      <a class="tp-btn{% unless forloop.first %} tp-btn--ghost{% endunless %}" href="{% if button.url contains 'http' %}{{ button.url }}" target="_blank" rel="noopener{% else %}{{ button.url | relative_url }}{% endif %}">{{ button.label }}</a>
      {%- endfor %}
    </div>
    {%- endif %}
  </div>
</header>

{{ content }}
