#
# Teampass.net — Jekyll configuration
#
# Editorial content lives in _data/*.yml, not here.
# This file holds build settings, site identity and canonical external links.
#

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
exclude:
  - node_modules
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - _old
  - old_releases
  - teampass_ext_lib.txt

# Jekyll skips dot-directories unless they are listed here.
include:
  - .well-known

sass:
  sass_dir: _sass
  style: compressed

# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: Teampass
tagline: Self-hosted collaborative password manager
description: >-
  Teampass is an open-source, self-hosted password manager for teams.
  Folder-level access control, authenticated AES-256-GCM encryption,
  access recertification and compliance evidence — on your own servers.
lang: en
url: "https://teampass.net"
baseurl: ""
email: nils@teampass.net

# Social preview image used when no page-specific image is set.
# TODO(nils): produce images/og-image.png at 1200x630 — until it exists, links
# shared on Slack, LinkedIn and X render without a preview card.
default-image: /images/og-image.png

