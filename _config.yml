# ---------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------
# The former Universal Analytics property (UA-43236218-1) was shut down by
# Google in 2023 and collected nothing. Leave `provider` empty to ship no
# tracker at all.
#
# GA4 property 361510583 (teampass.net). The property ID is *not* what the tag
# uses: `measurement_id` is the web data stream's "G-XXXXXXXXXX", found under
# GA4 Admin > Data streams > (web stream) > Measurement ID.
analytics:
  provider: "google"   # "google", "plausible" or "" (none)
  domain: teampass.net

  # --- Google Analytics 4 -------------------------------------------------
  ga4_property_id: "361510583"   # reference only, not used by the tag
  measurement_id: "G-5NS849FBPH" 
  anonymize_ip: true             # sets `anonymize_ip` on the config call

  # --- Plausible ----------------------------------------------------------
  script: ""        # e.g. https://plausible.example.com/js/script.js
